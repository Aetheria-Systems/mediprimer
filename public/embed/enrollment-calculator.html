<style>

  :root { color-scheme: light; }
  body { margin: 0; padding: 14px; font-family: Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif; color: #14213d; background: #fff; }
  h2 { font-size: 1.15rem; color: #1f4e79; margin: 0 0 .2rem; }
  .sub { font-size: .9rem; color: #4a5568; margin: 0 0 .8rem; }
  .calc-form fieldset { border: 2px solid #1f4e79; border-radius: 8px; padding: .8rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .calc-form legend { font-weight: 700; color: #1f4e79; padding: 0 .4rem; font-size: .9rem; }
  .calc-form select, .calc-form input { padding: .5rem; border: 1px solid #b9c6d4; border-radius: 5px; font-size: 1rem; min-height: 44px; }

  .calc-best { background: #eef5fb; border-left: 4px solid #1f4e79; padding: .6rem .8rem; border-radius: 6px; margin: .7rem 0; }
  .calc-penalty { background: #fdf6e3; border-left: 4px solid #c9a227; padding: .6rem .8rem; border-radius: 6px; margin: .7rem 0; }
  .calc-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .calc-table th, .calc-table td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #e2e8f0; }
  .calc-note { font-size: .8rem; color: #4a5568; }
  .table-scroll { overflow-x: auto; }
  .credit { margin-top: 1rem; padding-top: .6rem; border-top: 1px solid #e2e8f0; font-size: .82rem; color: #4a5568; }

<h2>When can I sign up for Medicare?</h2>
<p class="sub">Enter a date of birth to see the exact sign-up window and what waiting costs.</p>
<div id="enrollment-calculator"></div>
<p class="credit">Free tool from <a href="https://mediprimer.org/medicare-enrollment-calculator.html" target="_blank" rel="noopener">MediPrimer</a> — a plain-language guide to Medicare and Medicaid, also in Spanish, Chinese and Vietnamese. Independent, no ads, sells nothing.</p>
