<div class="note tip">
      <strong>Quý vị muốn được trợ giúp miễn phí và không thiên vị về việc này?</strong> Một <a href="/vi/ship-directory.html">tư vấn viên SHIP</a> cung cấp hướng dẫn miễn phí, riêng cho từng cá nhân về Medicare và không bán bất cứ thứ gì. Đối với Medicaid, hãy liên hệ <a href="/vi/state-medicaid.html">cơ quan tiểu bang</a> của quý vị. Quý vị cũng có thể gọi số 1-800-MEDICARE (1-800-633-4227).
    </div>
