<div class="note tip">
      <strong>Quý vị muốn được trợ giúp miễn phí và khách quan về việc này?</strong> Một <a href="/ship-directory.html">tư vấn viên SHIP</a> hướng dẫn miễn phí, trực tiếp từng người về Medicare và không bán bất cứ thứ gì. Về Medicaid, hãy liên hệ <a href="/state-medicaid.html">cơ quan tiểu bang</a> của quý vị. Quý vị cũng có thể gọi 1-800-MEDICARE (1-800-633-4227).
    </div>
