@page { size: Letter landscape; margin: 0.5in; }
body { margin:0; font-family: Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif; }
.wrap { width:100%; } svg { width:100%; height:auto; }

</style></head><body><div class="wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d"><title id="t">Các phần của Medicare và mỗi phần trả cho gì</title><desc id="d">Phần A trả viện phí bệnh viện. Phần B trả cho bác sĩ và điều trị ngoại trú. Phần D trả thuốc theo đơn. Phần C, Medicare Advantage, là gói tư nhân kết hợp tất cả.</desc><rect width="1200" height="620" fill="#ffffff"/><text x="60" y="58" text-anchor="start" style="font:700 30px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Các phần của Medicare và mỗi phần trả cho gì</text><text x="60" y="88" text-anchor="start" style="font:400 18px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#4a5568">Medicare Gốc là Phần A và Phần B. Phần D thêm cho thuốc. Phần C là cách khác để có đủ tất cả.</text><rect x="60" y="130" width="330" height="230" rx="10" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/><rect x="60" y="130" width="330" height="52" rx="10" fill="#1f4e79"/><rect x="60" y="166" width="330" height="16" fill="#1f4e79"/><text x="225" y="164" text-anchor="middle" style="font:700 20px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#ffffff">PHẦN A — Bệnh viện</text><text x="80" y="212" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Nằm viện nội trú. Điều dưỡng</text><text x="80" y="236" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">chuyên môn sau khi xuất viện. Chăm</text><text x="80" y="260" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">sóc hospice. Một số chăm sóc tại</text><text x="80" y="284" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">nhà.</text><rect x="420" y="130" width="330" height="230" rx="10" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/><rect x="420" y="130" width="330" height="52" rx="10" fill="#1f4e79"/><rect x="420" y="166" width="330" height="16" fill="#1f4e79"/><text x="585" y="164" text-anchor="middle" style="font:700 20px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#ffffff">PHẦN B — Y tế</text><text x="440" y="212" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Khám bác sĩ. Điều trị ngoại trú.</text><text x="440" y="236" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Khám sàng lọc phòng bệnh. Xét</text><text x="440" y="260" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">nghiệm. Thiết bị y tế bền.</text><rect x="780" y="130" width="330" height="230" rx="10" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/><rect x="780" y="130" width="330" height="52" rx="10" fill="#1f4e79"/><rect x="780" y="166" width="330" height="16" fill="#1f4e79"/><text x="945" y="164" text-anchor="middle" style="font:700 20px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#ffffff">PHẦN D — Thuốc</text><text x="800" y="212" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Thuốc theo đơn lấy tại nhà thuốc.</text><text x="800" y="236" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Bán bởi các gói tư nhân. Mỗi gói</text><text x="800" y="260" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">có danh sách thuốc riêng.</text><rect x="60" y="392" width="1080" height="120" rx="10" fill="#eef5fb" stroke="#c9a227" stroke-width="3"/><text x="84" y="428" text-anchor="start" style="font:700 20px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">PHẦN C — Medicare Advantage</text><text x="84" y="458" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Gói tư nhân thay thế Medicare Gốc. Phải bao gồm mọi thứ Phần A và B chi trả, thường có Phần D,</text><text x="84" y="482" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">và thêm nhiều lợi ích khác. Đổi lại, bạn dùng mạng lưới bác sĩ của gói và theo quy tắc phê duyệt</text><text x="84" y="506" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">của họ.</text><text x="60" y="556" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#4a5568">Medicare không trả cho chăm sóc dài hạn dạng custodial, và Medicare Gốc không có mức trần chi phí hàng năm.</text><text x="1140" y="556" text-anchor="end" style="font:400 14px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#7a8ba3">mediprimer.org</text></svg>
