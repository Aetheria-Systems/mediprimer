</style></head><body><div class="wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d"><title id="t">Medicare, Medicaid, hay cả hai?</title><desc id="d">Medicare dựa trên tuổi hoặc khuyết tật. Medicaid dựa trên thu nhập. Nhiều người đủ điều kiện cả hai, gọi là dual eligible và nhận được nhiều hỗ trợ nhất.</desc><rect width="1200" height="620" fill="#ffffff"/><text x="60" y="58" text-anchor="start" style="font:700 30px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Medicare, Medicaid, hay cả hai?</text><text x="60" y="88" text-anchor="start" style="font:400 18px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#4a5568">Đây là hai chương trình khác nhau với quy tắc khác nhau — và có cả hai là điều phổ biến.</text><rect x="60" y="130" width="300" height="300" rx="10" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/><rect x="60" y="130" width="300" height="56" rx="10" fill="#1f4e79"/><rect x="60" y="170" width="300" height="16" fill="#1f4e79"/><text x="210" y="166" text-anchor="middle" style="font:700 20px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#ffffff">MEDICARE</text><text x="80" y="216" text-anchor="start" style="font:700 16px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#1f4e79">Dựa trên tuổi hoặc khuyết tật</text><text x="80" y="248" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Bạn 65 tuổi trở lên, hoặc đã</text><text x="80" y="272" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">nhận trợ cấp khuyết tật 24</text><text x="80" y="296" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">tháng, hoặc mắc ESRD hay ALS.</text><text x="80" y="320" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Thu nhập không quan trọng.</text><rect x="450" y="130" width="300" height="300" rx="10" fill="#ffffff" stroke="#2e7d5b" stroke-width="3"/><rect x="450" y="130" width="300" height="56" rx="10" fill="#2e7d5b"/><rect x="450" y="170" width="300" height="16" fill="#2e7d5b"/><text x="600" y="166" text-anchor="middle" style="font:700 20px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#ffffff">MEDICAID</text><text x="470" y="216" text-anchor="start" style="font:700 16px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#2e7d5b">Dựa trên thu nhập</text><text x="470" y="248" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Thu nhập và tài sản của bạn dưới</text><text x="470" y="272" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">mức giới hạn của tiểu bang. Quy</text><text x="470" y="296" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">tắc và tên gọi khác nhau theo</text><text x="470" y="320" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">từng tiểu bang. Mọi lứa tuổi.</text><rect x="840" y="130" width="300" height="300" rx="10" fill="#ffffff" stroke="#c9a227" stroke-width="3"/><rect x="840" y="130" width="300" height="56" rx="10" fill="#c9a227"/><rect x="840" y="170" width="300" height="16" fill="#c9a227"/><text x="990" y="166" text-anchor="middle" style="font:700 20px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#ffffff">CẢ HAI — DUAL ELIGIBLE</text><text x="860" y="216" text-anchor="start" style="font:700 16px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#c9a227">Bạn đủ điều kiện cho cả hai</text><text x="860" y="248" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Medicare trả trước, Medicaid bù</text><text x="860" y="272" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">phần thiếu. Phí bảo hiểm, đồng</text><text x="860" y="296" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">chi trả và chăm sóc dài hạn có</text><text x="860" y="320" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">thể được chi trả. Hỗ trợ nhiều</text><text x="860" y="344" text-anchor="start" style="font:400 15px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">nhất.</text><rect x="60" y="462" width="1080" height="76" rx="10" fill="#eef5fb" stroke="#1f4e79" stroke-width="2"/><text x="84" y="496" text-anchor="start" style="font:700 16px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">Nếu bạn có Medicare và thu nhập thấp, hãy kiểm tra Medicaid và Medicare Savings Programs. Nhiều</text><text x="84" y="520" text-anchor="start" style="font:400 16px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#14213d">người đủ điều kiện chưa từng nộp đơn.</text><text x="1140" y="576" text-anchor="end" style="font:400 14px Georgia,'Noto Serif','WenQuanYi Zen Hei','Droid Sans Fallback',serif;fill:#7a8ba3">mediprimer.org</text></svg>
